[package]
name = "rustping"
version = "0.0.1"
edition = "2024"
description = "A fast, general-purpose desktop ping-wheel overlay app in Rust — inspired by lolPing, without the LoL binding"
repository = "https://github.com/Haaaatcher/RustPing"

[dependencies]
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
pollster = "1.0.1"
raw-window-handle = "0.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wgpu = "30.0.1"
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
winit = "0.30"

[build-dependencies]
winresource = "0.1.34"
