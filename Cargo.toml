[package]
name = "rustping"
version = "0.0.1"
edition = "2024"
description = "A fast, general-purpose desktop ping-wheel overlay app in Rust — inspired by lolPing, without the LoL binding"
repository = "https://github.com/Haaaatcher/RustPing"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "system_fonts"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
